<style>:root{color-scheme:light}body{margin:0}</style>
<title>Sasi Kaladharan Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Source+Serif+4:ital,wght@1,500;1,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: one narrow column like a card held in the hand. Name on top, a switch between the two businesses, then details and a scannable code. */
:root {
  --bg: #f1f2f3;
  --surface: #f7f8f8;
  --fg: #1a1c1e;
  --muted: #5a6065;
  --accent: #c2371c;
  --line: #cdd1d4;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.head { padding-top: 6px; display: flex; align-items: center; gap: 16px; }
.head > div { min-width: 0; }
.logo { width: 76px; height: auto; flex: none; }
.eyebrow {
  font-family: var(--display); font-weight: 600; font-size: 14px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
}
h1 {
  font-family: var(--serif); font-style: italic; font-weight: 600;
  font-size: clamp(34px, 10vw, 44px); line-height: 1.05; margin: 6px 0 0;
  text-wrap: balance;
}
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tab {
  font: inherit; text-align: left; cursor: pointer;
  background: transparent; color: var(--muted);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.tab b { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg); }
.tab span { font-size: 13px; }
.tab[aria-selected="true"] { background: var(--surface); border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); color: var(--fg); }
.tab:focus-visible, .copy:focus-visible, .big:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; border-top: 4px solid var(--accent); padding: 20px 18px; display: flex; flex-direction: column; gap: 20px; }
.company { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 7vw, 30px); line-height: 1.05; letter-spacing: 0.02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.role { margin: 6px 0 0; color: var(--muted); font-weight: 500; }
.units { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.units li { font-size: 13px; font-weight: 500; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.iso { margin: 10px 0 0; font-family: var(--display); font-weight: 600; letter-spacing: 0.08em; font-size: 14px; text-transform: uppercase; color: var(--muted); }

dl { margin: 0; display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.row:last-child { border-bottom: 1px solid var(--line); }
dt { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
dd a { color: inherit; text-decoration: none; }
dd a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
.copy {
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  background: transparent; color: var(--accent); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; min-width: 64px;
}
.copy:hover { border-color: var(--accent); }

.share { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.qr { background: #ffffff; padding: 8px; border-radius: 8px; border: 1px solid var(--line); width: min(100%, 300px); line-height: 0; }
.qr svg { width: 100%; height: auto; display: block; }
.share h2 { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0; }
.share p { margin: 0; color: var(--muted); font-size: 15px; max-width: 34ch; }
.big {
  font: inherit; font-weight: 600; cursor: pointer; width: 100%;
  background: var(--accent); color: #ffffff; border: 0; border-radius: 8px; padding: 13px 16px;
}
.foot { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .copy, .tab, .big { transition: border-color .15s, background-color .15s; }
}
</style>

</head>

    <div>
      <div class="eyebrow">Contact card</div>
      <h1>Er. Sasi Kaladharan</h1>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Choose a business">
    <button class="tab" role="tab" id="tab-emco" aria-controls="panel" data-key="emco"><b>Yeskay EMCO</b><span>Managing Director</span></button>
    <button class="tab" role="tab" id="tab-canoe" aria-controls="panel" data-key="canoe"><b>Canoe Resorts</b><span>CMD</span></button>
  </div>

  <section class="panel" id="panel" role="tabpanel">
    <div>
      <h2 class="company" id="company"></h2>
      <p class="role" id="role"></p>
      <ul class="units" id="units" hidden></ul>
      <p class="iso" id="iso" hidden></p>
    </div>
    <dl id="rows"></dl>
  </section>

  <section class="share panel" aria-labelledby="share-h">
    <h2 id="share-h">Save to your contacts</h2>
    <div class="qr" id="qr" aria-label="QR code containing this contact card"></div>
    <p>Open the camera on your phone and point it at this code. Tap the prompt that appears to add the contact.</p>
    <button class="big" id="copyAll" type="button">Copy all details</button>
  </section>

  <p class="foot">A photo can be added on request.</p>
</main>

<script>
(function () {
  var CARDS = {
    emco: {
      org: "Yeskay Electro-Mechanical Co. Pvt. Ltd.",
      title: "Managing Director",
      units: [],
      iso: "BS EN ISO 9001:2008 accredited",
      phones: [
        { label: "Mobile", value: "+966 50 582 2504", cell: true },
        { label: "Phone", value: "+966 13 864 8464" },
        { label: "Phone", value: "+966 13 893 4864" },
        { label: "Phone", value: "+966 13 889 5201" },
        { label: "Fax", value: "+966 13 899 3994", fax: true }
      ],
      emails: ["md@yeskayemco.com"],
      addr: { text: "P.O. Box 30003, Al-Khobar 31952, Kingdom of Saudi Arabia", street: "P.O. Box 30003", city: "Al-Khobar", region: "", zip: "31952", country: "Saudi Arabia" }
    },
    canoe: {
      org: "Canoe Hotels & Resorts Pvt. Ltd.",
      title: "CMD",
      units: ["Yeskay Convention Center", "Yeskay Foundation"],
      iso: "",
      phones: [
        { label: "Mobile", value: "+966 50 582 2504", cell: true },
        { label: "Phone", value: "+91 477 2268800" },
        { label: "Phone", value: "+91 477 2268889" }
      ],
      emails: ["canoeresorts@gmail.com", "yeskayfoundation@gmail.com"],
      addr: { text: "Sanathanapuram P.O., Kalarcode, Alappuzha, Kerala, India", street: "Sanathanapuram P.O., Kalarcode", city: "Alappuzha", region: "Kerala", zip: "", country: "India" }
    }
  };

  function vcard(c) {
    var L = ["BEGIN:VCARD", "VERSION:3.0", "N:Kaladharan;Sasi;;Er.;", "FN:Er. Sasi Kaladharan",
      "ORG:" + c.org.replace(/,/g, "\\,"), "TITLE:" + c.title];
    c.phones.forEach(function (p) {
      L.push("TEL;TYPE=" + (p.cell ? "" : "WORK,") + (p.fax ? "FAX" : p.cell ? "CELL" : "VOICE") + ":" + p.value.replace(/ /g, ""));
    });
    c.emails.forEach(function (e) { L.push("EMAIL;TYPE=WORK:" + e); });
    var a = c.addr;
    L.push("ADR;TYPE=WORK:;;" + [a.street, a.city, a.region, a.zip, a.country].join(";"));
    L.push("END:VCARD");
    return L.join("\n");
  }

  function plainText(c) {
    var t = ["Er. Sasi Kaladharan", c.title + ", " + c.org];
    c.units.forEach(function (u) { t.push(u); });
    c.phones.forEach(function (p) { t.push(p.label + ": " + p.value); });
    c.emails.forEach(function (e) { t.push("Email: " + e); });
    t.push("Address: " + c.addr.text);
    return t.join("\n");
  }

  function copyText(text, btn, idle) {
    function done() { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = idle; }, 1500); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) done(); else { btn.textContent = "Select text"; setTimeout(function () { btn.textContent = idle; }, 1800); }
    }
    try {
      navigator.clipboard.writeText(text).then(done, fallback);
    } catch (e) { fallback(); }
  }

  var current = "emco";
  var rows = document.getElementById("rows");

  function addRow(label, node, copyValue) {
    var r = document.createElement("div"); r.className = "row";
    var dt = document.createElement("dt"); dt.textContent = label;
    var dd = document.createElement("dd"); dd.appendChild(node);
    var b = document.createElement("button");
    b.type = "button"; b.className = "copy"; b.textContent = "Copy";
    b.setAttribute("aria-label", "Copy " + label.toLowerCase());
    b.addEventListener("click", function () { copyText(copyValue, b, "Copy"); });
    r.appendChild(dt); r.appendChild(dd); r.appendChild(b);
    rows.appendChild(r);
  }
  function link(href, text) { var a = document.createElement("a"); a.href = href; a.textContent = text; return a; }
  function span(text) { var s = document.createElement("span"); s.textContent = text; return s; }

  function render(key) {
    current = key;
    var c = CARDS[key];
    document.querySelectorAll(".tab").forEach(function (t) {
      t.setAttribute("aria-selected", t.dataset.key === key ? "true" : "false");
      t.tabIndex = t.dataset.key === key ? 0 : -1;
    });
    document.getElementById("company").textContent = c.org;
    document.getElementById("role").textContent = c.title;
    var u = document.getElementById("units");
    u.innerHTML = ""; u.hidden = !c.units.length;
    c.units.forEach(function (x) { var li = document.createElement("li"); li.textContent = x; u.appendChild(li); });
    var iso = document.getElementById("iso");
    iso.hidden = !c.iso; iso.textContent = c.iso;

    rows.innerHTML = "";
    c.phones.forEach(function (p) {
      addRow(p.label, p.fax ? span(p.value) : link("tel:" + p.value.replace(/ /g, ""), p.value), p.value);
    });
    c.emails.forEach(function (e) { addRow("Email", link("mailto:" + e, e), e); });
    addRow("Address", span(c.addr.text), c.addr.text);

    var box = document.getElementById("qr");
    try {
      var qr = qrcode(0, "L");
      qr.addData(vcard(c));
      qr.make();
      box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    } catch (e) {
      box.textContent = "The code could not be drawn. Use Copy all details instead.";
      box.style.lineHeight = "1.4"; box.style.color = "#000";
    }
    try { history.replaceState(null, "", "#" + key); } catch (e) {}
  }

  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () { render(t.dataset.key); });
    t.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
        var other = t.dataset.key === "emco" ? "canoe" : "emco";
        render(other); document.getElementById("tab-" + other).focus();
      }
    });
  });
  var all = document.getElementById("copyAll");
  all.addEventListener("click", function () { copyText(plainText(CARDS[current]), all, "Copy all details"); });

  var h = (location.hash || "").replace("#", "");
  render(CARDS[h] ? h : "emco");
})();
</script>
